name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          for f in *.zip; do unzip -q -o "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Build all mods
        run: |
          for d in */; do
            if [ -f "${d}gradlew" ]; then
              sed -i 's/>=0.19.5/>=0.18.0/' "${d}src/main/resources/fabric.mod.json"
              (cd "$d" && chmod +x gradlew && ./gradlew build --no-daemon)
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            */build/libs/*.jar
            !*/build/libs/*-sources.jar
